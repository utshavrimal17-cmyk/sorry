<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="theme-color" content="#08080d" />

  <title></title>

  <style>
    :root {
      --bg-1: #050507;
      --bg-2: #0b0b12;
      --text: #f7f7fa;
      --credit: rgba(247, 247, 250, 0.48);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at 50% 48%,
          rgba(100, 90, 150, 0.10) 0%,
          rgba(60, 55, 95, 0.045) 24%,
          transparent 52%
        ),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Very subtle moving ambient light */
    body::before {
      content: "";
      position: fixed;
      inset: -35%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(155, 145, 210, 0.055),
          transparent 34%
        );
      filter: blur(35px);
      animation: ambientMove 12s ease-in-out infinite alternate;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .content {
      width: min(100%, 1100px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .main-text {
      max-width: 100%;
      font-size: clamp(2.8rem, 9vw, 7.5rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
      font-weight: 900;
      white-space: nowrap;

      opacity: 0;
      transform: translateY(12px) scale(0.97);

      text-shadow:
        0 0 18px rgba(255, 255, 255, 0.08),
        0 0 45px rgba(145, 135, 200, 0.08);

      animation: mainIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
    }

    .credit {
      margin-top: 14px;

      font-size: clamp(0.55rem, 1.5vw, 0.82rem);
      line-height: 1;
      letter-spacing: 0.22em;
      font-weight: 500;
      white-space: nowrap;

      color: var(--credit);

      opacity: 0;
      transform: translateY(6px);

      animation: creditIn 0.8s ease-out 0.65s forwards;
    }

    @keyframes mainIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes creditIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes ambientMove {
      0% {
        transform: translate(-2%, -1%) scale(1);
      }

      100% {
        transform: translate(2%, 1%) scale(1.05);
      }
    }

    /* Extra protection for very small phones */
    @media (max-width: 360px) {
      .page {
        padding: 16px;
      }

      .main-text {
        font-size: clamp(2.35rem, 10.5vw, 3.2rem);
        letter-spacing: -0.06em;
      }

      .credit {
        margin-top: 11px;
        font-size: 0.5rem;
        letter-spacing: 0.17em;
      }
    }

    /* Tablet */
    @media (min-width: 600px) {
      .main-text {
        font-size: clamp(4rem, 9vw, 7rem);
      }
    }

    /* Reduced motion accessibility */
    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
      }

      .main-text,
      .credit {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="content">
      <div class="main-text">SORRY MITTARRRRRR</div>
      <div class="credit">CREATED BY UTSHAV</div>
    </div>
  </main>
</body>
</html>
