<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SORRY</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0a0c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Ambient Glow Background */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    /* Heading: SORRY */
    h1 {
      font-size: clamp(4rem, 15vw, 10rem);
      font-weight: 800;
      letter-spacing: 0.15em;
      text-indent: 0.15em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.2),
                   0 0 60px rgba(255, 255, 255, 0.1);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Subtitle: CREATED BY UTSHAV (Medium Size & Uppercase) */
    .subtitle {
      font-size: clamp(1.1rem, 3.5vw, 1.8rem);
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 5px;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    /* Button Styling */
    .btn {
      display: inline-block;
      padding: 18px 42px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-decoration: none;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      backdrop-filter: blur(10px);
      cursor: pointer;
      outline: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    /* Button Hover & Tap States */
    .btn:hover, .btn:focus {
      background: rgba(255, 255, 255, 1);
      color: #0a0a0c;
      border-color: rgba(255, 255, 255, 1);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
      transform: translateY(-2px) scale(1.02);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    /* Keyframes */
    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SORRY</h1>
    <span class="subtitle">CREATED BY UTSHAV</span>
    <button class="btn" id="acceptBtn">APOLOGY ACCEPTED</button>
  </div>

  <script>
    document.getElementById('acceptBtn').addEventListener('click', function(e) {
      e.preventDefault();
      
      // WhatsApp direct message text fully formatted
      const phone = '9779808904149';
      const text = encodeURIComponent('Apology accepted');
      const whatsappUrl = 'https://api.whatsapp.com/send?phone=' + phone + '&text=' + text;

      // Open WhatsApp Direct Chat with Pre-filled Message
      window.open(whatsappUrl, '_blank');
    });
  </script>

</body>
</html>
